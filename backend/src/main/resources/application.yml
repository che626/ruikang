server:
  port: 8081

spring:
  application:
    name: ruikang-fabric-qc-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB

qc:
  storage:
    root-path: D:/ruikang-data/qc-files
    database-relative-only: true
  inference:
    model-path: models/ruikang.onnx
    prefer-gpu: true
    fallback-to-cpu: true
    confidence-threshold: 0.45
    iou-threshold: 0.42
    continuous-hit-frames: 4
    evidence-image-count: 3
    target-inference-fps: 25
  admin:
    username: ${QC_ADMIN_USERNAME:admin}
    password: ${QC_ADMIN_PASSWORD:admin123}
    display-name: 系统管理员
  aigc:
    provider: DeepSeek
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-v4-pro}
    timeout-seconds: 75
    fallback-local: true
