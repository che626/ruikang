spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ruikang_fabric_qc}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

qc:
  storage:
    root-path: ${QC_STORAGE_ROOT:/app/data/qc-files}
  inference:
    model-path: ${QC_MODEL_PATH:models/ruikang.onnx}
    confidence-threshold: ${QC_CONFIDENCE_THRESHOLD:0.45}
    iou-threshold: ${QC_IOU_THRESHOLD:0.42}
    continuous-hit-frames: ${QC_CONTINUOUS_HIT_FRAMES:4}
    evidence-image-count: ${QC_EVIDENCE_IMAGE_COUNT:3}
    target-inference-fps: ${QC_TARGET_INFERENCE_FPS:60}
  aigc:
    api-key: ${DEEPSEEK_API_KEY:}
    fallback-local: ${AIGC_FALLBACK_LOCAL:true}
